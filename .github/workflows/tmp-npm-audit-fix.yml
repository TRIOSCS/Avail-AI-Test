# TEMPORARY — refreshes package-lock.json on Linux to clear the high-severity
# npm audit advisories (brace-expansion, undici) that security.yml's npm audit
# step gates on. The fixed versions are already allowed by package.json's
# existing overrides; only the lock is stale. No Node.js exists on the local
# dev machine, so the refresh runs here. Removed from the branch in a follow-up
# commit once it has run; it must never reach main.
name: Temp npm audit fix (security floors)

on:
  push:
    branches: [claude/wizardly-keller-ced241]

permissions:
  contents: write

jobs:
  npm-audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: npm audit fix (lockfile refresh within existing ranges)
        run: |
          npm audit fix
          echo "=== resulting diff ==="
          git diff --stat
          # Lockfile-only guard: package.json (and anything else) must be untouched.
          changed=$(git diff --name-only)
          if [ "$changed" != "package-lock.json" ]; then
            echo "::error::Expected only package-lock.json to change, got: $changed"
            exit 1
          fi

      - name: Gate — npm audit must pass at security.yml's level
        run: npm audit --audit-level=high

      - name: Gate — frontend still builds (includes postbuild bundle smoke test)
        run: |
          npm ci
          npm run build

      - name: Commit & push refreshed lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -F- <<'MSG'
          fix(security): refresh npm lock past high-severity audit advisories

          security.yml's npm audit step (--audit-level=high) fails on
          brace-expansion <=5.0.11 (GHSA-q2hr-2g5m-vwhr and friends) and
          undici <=7.29.0 (10 advisories). This was masked on main because
          the job died earlier at pip-audit; the pip-audit fix on this
          branch unmasked it. package.json's existing overrides already
          allow the fixed versions, so this is a lockfile-only refresh
          (npm audit fix; verified lockfile-only, audit-clean, and
          build-clean before committing). Compiled by the temporary
          tmp-npm-audit-fix workflow, removed right after this commit.

          Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>
          MSG
          git push

      - name: Frontend unit tests (informational, after push)
        run: npm run test:frontend
