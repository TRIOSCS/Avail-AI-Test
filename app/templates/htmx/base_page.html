{% extends "htmx/base.html" %}
{% from "htmx/partials/shared/_macros.html" import lazy_body %}

{% block content %}
{# Initial content loaded via HTMX on page load #}
{% call lazy_body(url=partial_url, target='#main-content', indicator='#page-load-spinner') %}
  <div id="page-load-spinner" class="htmx-indicator flex items-center justify-center py-20">
    <svg class="h-8 w-8 text-gray-400 spinner" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="31.4" stroke-dashoffset="10"/>
    </svg>
  </div>
{% endcall %}
{% endblock %}
